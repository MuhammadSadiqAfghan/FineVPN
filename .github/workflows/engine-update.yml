name: به‌روزرسانی موتور پروکسی FineVPN

on:
  schedule:
    - cron: '30 20 * * *'
    - cron: '30 23 * * *'
    - cron: '30 2 * * *'
    - cron: '30 5 * * *'
    - cron: '30 8 * * *'
    - cron: '30 11 * * *'
    - cron: '30 14 * * *'
    - cron: '30 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: نصب ابزارهای سیستمی
        run: sudo apt-get update && sudo apt-get install -y jq unzip curl
      - name: نصب وابستگی‌های Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: نصب هسته‌های Xray و Sing-box
        run: bash scripts-install-cores.sh
      - name: اجرای کامل دریافت و تبدیل کانفیگ‌ها
        env:
          DATA_DIR: ${{ github.workspace }}/.engine-data
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          python -m app.engine.cli --workers 24 --timeout 5 --rounds 3 --batch-size 200
      - name: آماده‌سازی خروجی‌های انتشار
        run: |
          mkdir -p exports
          find .engine-data/engine -maxdepth 1 -type f \
            \( -name '*.txt' -o -name '*.json' -o -name '*.yaml' -o -name '*.svg' -o -name '*.html' \) \
            ! -name 'engine_state.json' -exec cp -f {} exports/ \;
          mkdir -p exports/by_country
          if [[ -d .engine-data/engine/by_country ]]; then cp -R .engine-data/engine/by_country/. exports/by_country/; fi
          if [[ -f .engine-data/engine/hiddify/FineVPN_Serverless.jsonc ]]; then cp .engine-data/engine/hiddify/FineVPN_Serverless.jsonc exports/; fi
      - name: ثبت خروجی‌های به‌روزشده
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add exports/
          if git diff --cached --quiet; then echo 'No generated changes'; exit 0; fi
          git commit -m 'به‌روزرسانی خروجی‌های موتور پروکسی FineVPN'
          git push
