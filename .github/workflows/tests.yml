name: آزمون‌های خودکار FineVPN 2.0

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: نصب وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: بررسی و کامپایل ماژول‌های Python
        run: python -m compileall -q .
      - name: اجرای آزمون‌ها
        run: python -m pytest tests/ -q
