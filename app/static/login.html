<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><title>ورود مدیر · FineVPN</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/app.css"></head><body class="login-body"><main class="login-card"><img id="login-logo" class="login-logo"><div class="eyebrow">FINEVPN CONTROL CENTER · V2.0</div><h1>ورود به پنل مدیریت</h1><p class="muted">برای ادامه، اطلاعات حساب مدیر را وارد کنید.</p><form id="login-form"><label>نام کاربری</label><input id="username" value="admin" autocomplete="username" required><label>رمز عبور</label><input id="password" type="password" autocomplete="current-password" required><button class="btn red full" type="submit">ورود به پنل <span>←</span></button><p class="form-error" id="login-error"></p></form><small class="muted">FineVPN · نسخه 2.0</small></main><script>
const logo='__LOGO__';document.getElementById('login-logo').src=logo;
document.getElementById('login-form').addEventListener('submit',async e=>{e.preventDefault();let b=document.querySelector('button[type=submit]');b.disabled=true;try{let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});let d=await r.json();if(!r.ok)throw Error(d.detail||'ورود ناموفق');location.href='/dashboard';}catch(err){document.getElementById('login-error').textContent=err.message;}finally{b.disabled=false;}});
</script></body></html>
